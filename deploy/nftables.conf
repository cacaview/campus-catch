#!/usr/sbin/nft -f

destroy table inet game_web

table inet game_web {
    chain input {
        type filter hook input priority filter; policy drop;

        iifname "lo" accept
        ct state invalid drop
        ct state established,related accept

        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        tcp dport { 22, 80, 443, 3478 } ct state new accept
        udp dport { 3478, 49160-49200 } ct state new accept
    }

}
