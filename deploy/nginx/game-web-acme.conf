# Temporary HTTP-only site used to obtain the IP certificate with HTTP-01.
server {
    listen 80;
    listen [::]:80;
    server_name 106.53.199.187;

    root /var/www/acme;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
